name: Build and deploy Elegan Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elegan-admin-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEXT_PUBLIC_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secreto ${name} en GitHub."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm install

      - name: Link Vercel project and pull settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Configure backend URL for the build
        shell: bash
        run: |
          printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "$NEXT_PUBLIC_API_BASE_URL" > .env.production.local

      - name: Build production output
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production output
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
